# Pre-recorded attack datasets. Their events date back to about 2020,
# so retention is 10 years; the 6-year default would delete them on arrival.
[attack]
homePath   = $SPLUNK_DB/attack/db
coldPath   = $SPLUNK_DB/attack/colddb
thawedPath = $SPLUNK_DB/attack/thaweddb
frozenTimePeriodInSecs = 315360000
maxTotalDataSizeMB = 5000

# Live logs from this laptop. Keep 30 days and at most 3 GB on D:.
[endpoint]
homePath   = $SPLUNK_DB/endpoint/db
coldPath   = $SPLUNK_DB/endpoint/colddb
thawedPath = $SPLUNK_DB/endpoint/thaweddb
frozenTimePeriodInSecs = 2592000
maxTotalDataSizeMB = 3000